name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish Windows exe
        run: >
          dotnet publish src/L2Updater.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=0.1.${{ github.run_number }}
          -o publish

      - name: SHA-256
        run: sha256sum publish/L2Updater.exe | tee publish/L2Updater.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: L2Updater-${{ github.sha }}
          path: publish/
          retention-days: 30

  # Latest test build for manual checks on Windows: one fixed link, no login needed.
  # Automatic build of main for checks on Windows; NOT an official release (releases: release.yml, tags v*).
  test-build:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: L2Updater-${{ github.sha }}
          path: publish

      - name: Replace the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build publish/L2Updater.exe publish/L2Updater.exe.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Test build 0.1.$RUN" \
            --notes "Automatic test build 0.1.$RUN of commit $GITHUB_SHA. Automatic build of main for testing, not an official release. Players get the program from the site."
