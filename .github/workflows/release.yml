name: release

# Official release: push a tag like v0.2.0. The version of the exe is taken from the tag,
# so the same tag always builds the same version (the manifest "updater.version" must equal it).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish Windows exe
        env:
          TAG: ${{ github.ref_name }}
        run: >
          dotnet publish src/L2Updater.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${TAG#v}
          -o publish

      - name: SHA-256
        run: sha256sum publish/L2Updater.exe | tee publish/L2Updater.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: publish/
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: publish

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(cut -d' ' -f1 publish/L2Updater.exe.sha256)
          gh release create "$TAG" publish/L2Updater.exe publish/L2Updater.exe.sha256 \
            --verify-tag --title "L2Updater ${TAG#v}" \
            --notes "Release build of tag $TAG (commit $GITHUB_SHA). SHA-256 of L2Updater.exe: $sha. Check the hash before running. Players get the program from the site, where its hash is also published."
